name: 기능 추가 요청
description: 새로운 기능이 필요하다면 작성해 주세요.
title: "[FEAT] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 기능 추가 요청서

  - type: textarea
    id: description
    attributes:
      label: 💡 기능 설명
      description: 어떤 기능이 필요한지 구체적으로 작성해 주세요.
      placeholder: "ex) 투두 만들기 기능"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 🤔 필요 이유
      description: 왜 이 기능이 필요한가요?
      placeholder: "사용자 경험 개선, 접근성 향상 등"
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: ✅ 기대 동작
      description: 이 기능이 어떻게 동작하면 좋을지 예시를 들어 설명해 주세요.
      placeholder: |
        예) 버튼을 누르면 입력창이 나타나고, 내용을 작성한 뒤 '추가'를 누르면 리스트에 등록됩니다.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 📎 기타 참고 사항
      description: 참고할 만한 링크, 이미지, 디자인, 참고 사례 등이 있다면 작성해 주세요.
      placeholder: |
        예) Figma 디자인 링크, Notion 요구사항 문서, 다른 앱 스크린샷 등
    validations:
      required: false

  - type: checkboxes
    id: agreement
    attributes:
      label: 📝 확인 사항
      options:
        - label: 본 기능은 중복되지 않음을 확인했습니다.
        - label: 이슈 작성 전 팀원과 간단히 공유했습니다.
